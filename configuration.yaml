esphome:
  name: xiao-esp32c6-rf-blaster

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

api:
ota:
  - platform: esphome

logger:
  level: DEBUG

spi:
  clk_pin: GPIO19
  miso_pin: GPIO20
  mosi_pin: GPIO18

cc1101:
  id: rf_radio
  cs_pin: GPIO21
  frequency: 433.92MHz

text_sensor:
  - platform: template
    name: "Received RF Code"
    id: rf_code_sensor

text:
  - platform: template
    name: "RF Command Input"
    id: rf_command_input
    optimistic: true
    min_length: 0
    max_length: 100
    mode: text

button:
  - platform: template
    name: "Send RF Command"
    id: send_rf_cmd_btn
    on_press:
      then:
        - lambda: |-
            std::string cmd = id(rf_command_input).state;
            int proto = 1;
            unsigned long long code = 0;
            
            // Parse the concise "X:YYYY" string directly, fallback to raw integer
            if (sscanf(cmd.c_str(), "%d:%llu", &proto, &code) == 2 ||
                sscanf(cmd.c_str(), "%llu", &code) == 1) {
                
                // Dynamically deduce bit length based on code magnitude
                uint8_t len = 24;
                if (code > 0xFFFFFFFFULL) {
                    len = 64;
                } else if (code > 0xFFFFFFULL) {
                    len = 32;
                }
                
                // ESPHome stores valid protocols 1-8 at array indices 1-8
                if (proto >= 1 && proto <= 8) {
                    ESP_LOGD("rf_tx", "Transmitting Protocol %d, Code %llu, Length %d", proto, code, len);
                    auto call = id(rf_tx).transmit();
                    // Append pulses 8 times directly to the RMT buffer for a solid burst
                    for (int i = 0; i < 8; i++) {
                        esphome::remote_base::RC_SWITCH_PROTOCOLS[proto].transmit(call.get_data(), code, len);
                    }
                    call.perform();
                } else {
                    ESP_LOGW("rf_tx", "Parsed invalid protocol: %d", proto);
                }
            } else {
                ESP_LOGW("rf_tx", "Could not parse RF command from input: %s", cmd.c_str());
            }

remote_receiver:
  id: rf_rx
  pin: GPIO2
  dump: 
    - rc_switch
  tolerance: 50%
  filter: 100us
  idle: 4ms
  on_rc_switch:
    then:
      - lambda: |-
          char str[64];
          // Formats overheard codes directly to "protocol:data"
          sprintf(str, "%d:%llu", x.protocol, x.code);
          id(rf_code_sensor).publish_state(str);

remote_transmitter:
  id: rf_tx
  pin: GPIO1
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx
